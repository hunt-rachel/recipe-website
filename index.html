<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie-edge">
        <title>Recipes Website</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--scripts definitions-->
        <script src="js files/customComponents.js"></script> 
        <script src="js files/recipeFunctions.js"></script> 
        <script src="js files/buttonFunctions.js"></script>
        
        <!--navigation bar-->
        <nav-bar 
            navText="home"
            btnState="hidden";
        ></nav-bar>

        <nav-overlay></nav-overlay>

        <!--home contents-->
        <div class="homeWelcome centerTxt">
            <h1 id="startPhrase">awesome start phrase!</h1>
            <h2>Welcome to a collection of all of my favourite recipes. 
                <br>Here, you can find food that's quick <i>and</i> easy to cook, while still being tasty!
            </h2>
        </div>

        <div class="homeLinks row">
            <home-link 
                url="recipes-list.html"
                id="allRecipesLink"
                linkIcon="&#128366;"
                iconColour="teal"
                linkText="all recipes"
            ></home-link>

            <home-link 
                url="favourites.html"
                id="favouritesLink"
                linkIcon="&#9829;"
                iconColour="red"
                linkText="favourites"
            ></home-link>

            <home-link 
                url="recipe-instructions.html"
                id="surpriseLink"
                linkIcon="?"
                iconColour="purple"
                linkText="surprise me!"
            ></home-link>
        </div>

        <script>     
            var startPhrases = [
                "Let's get cooking!",
                "Ready for some fine dining?",
                "What's on the menu for tonight?",
                "Find your new favourite meal here!",
            ]

            //set start phrase for home page
            let randIndex = Math.floor(Math.random() * startPhrases.length);
            
            function setStartPhrase() {
                document.getElementById("startPhrase").innerHTML = startPhrases[randIndex];
            }

            //ensures different phrase displayed even if back button pressed
            window.onload = setStartPhrase;
            
            const searchInput = document.getElementById("searchInput");
            const searchBtn = document.getElementById("searchBtn");
            
            autocomplete(searchInput, masterAutocompleteArr);
            searchBtn.addEventListener("click", function(){assignSearchValue(searchInput)});

            const surpriseBtn = document.getElementById("surpriseLink");
            const surpriseURL = surpriseBtn.querySelector(".homeLinkURL")

            //function written here to ensure different random index picked on each click
            surpriseBtn.addEventListener("click", function(){
                var recipes = Object.keys(recipesObj);
                let rand = Math.floor(Math.random() * recipes.length);
                
                surpriseURL.href += ("?id=" + recipes[rand])
            })
        </script>

    </body>
</html>
