<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie-edge">
        <title>Recipes Website</title>
        <link rel="stylesheet" href="style.css"> 
    </head>
    <body>
        <!--scripts definitions-->
        <script src="js files/customComponents.js"></script> 
        <script src="js files/buttonFunctions.js"></script>
        <script src="js files/recipeFunctions.js"></script>
        
        <!--navigation bar-->
        <nav-bar
            navText="recipe name" 
            btnState="show"
        ></nav-bar>

        <nav-overlay></nav-overlay> 
        <!--recipe search listings-->
        <div class="listingsBody row">
            <div class="searchListings" id="searchDiv"></div>
            <filter-block></filter-block>
        </div>
        
        

    </body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const searchVal = urlParams.get('search');

        if(localStorage.getItem('favourites')) { 
            var favouritesArr = JSON.parse(localStorage['favourites']);
        }

        displaySearchResults(searchVal);

        assignHearts(favouritesArr);

        const searchInput = document.getElementById("searchInput");
        const searchBtn = document.getElementById("searchBtn");
        
        autocomplete(searchInput, masterAutocompleteArr);
        searchBtn.addEventListener("click", function(){assignSearchValue(searchInput)});
    </script>
</html>
