<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie-edge"> 
        <title>Recipes Website</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--scripts definitions-->
        <script src="js files/customComponents.js"></script>
        <script src="js files/buttonFunctions.js"></script>
        <script src="js files/recipeFunctions.js"></script>
        
        <!--navigation bar-->
        <nav-bar
            navText="recipe name"
        ></nav-bar>

        <nav-overlay></nav-overlay>

        <div class="instructionsBody center row">
            <!--ingredients-->
            <div class="ingredients">
                <h2 class="centerTxt">ingredients:</h2>
                <ul id="ingredientsList">
                </ul>
            </div>

            <!--title info and text-->
            <div class="mainInstBody">
                <div class="recipeHeader">
                    <div class="recipeTitle row centerVertical">
                        <h1 id="rTitle">RECIPE NAME</h1>
                        <div class="line"></div>
                        <div class="dot"></div>
                    </div>
                </div>
                
                <div class="recipeText">

                </div>
            </div>
        </div>

    </body>

<script>
    const urlParams = new URLSearchParams(window.location.search)
    const currID = urlParams.get('id');
    window.onload = displayRecipeInstructions(currID);
</script>
</html>
