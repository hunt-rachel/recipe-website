<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie-edge"> 
        <title>Recipes Website</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--scripts definitions-->
        <script src="js files/customComponents.js"></script>
        <script src="js files/buttonFunctions.js"></script>
        <script src="js files/recipeFunctions.js"></script>
        
        <!--navigation bar-->
        <nav-bar-2
            navText="recipe name"
        ></nav-bar-2>

        <nav-overlay></nav-overlay>

        <div class="instructionsBody center row">
            <!--ingredients-->
            <div class="ingredients">
                <h2 class="centerTxt">ingredients:</h2>
                <ul id="ingredientsList">
                </ul>
            </div>

            <!--title info and text-->
            <div class="mainInstBody">
                <!--title info-->
                <div class="recipeHeader">
                    <div class="recipeTitle row centerVertical">
                        <h1 id="rTitle">RECIPE NAME</h1>
                        <div class="line"></div>
                        <div class="dot"></div>
                    </div>
                    
                    <div id="recipeTags" class="tags row"></div>
                    
                    <div class="recipeInfo row">
                        <div id="recipeTiming"><p><span><i>time</i>: abc minutes (x prep, y cooking)</span></p></div>
                        <div id="recipeServing"><p><span><i>servings</i>: x amount</span></p></div>
                        <div id="recipeInspo"><p><span><i>inspiration</i>: x amount</span></p></div>
                    </div>

                    <!--text-->
                    <div class="instructionsText">
                        <h2>instructions</h2>
                        <ol id="instructionsList"></ol>
                    </div>
                </div>
                
                <div class="recipeText">

                </div>
            </div>
        </div>

    </body>

<script>
    const urlParams = new URLSearchParams(window.location.search)
    const currID = urlParams.get('id');
    window.onload = displayRecipeInstructions(currID);

    autocomplete(document.getElementById("searchInput"), masterAutocompleteArr);
</script>
</html>
